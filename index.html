<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HinosIEB - Biblioteca de Partituras</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo-area">
                    <i class="fas fa-music"></i>
                    <h1>Hinos<span>IEB</span></h1>
                </div>
                <p class="subtitle">Biblioteca Digital de Partituras</p>
            </div>
            <button id="themeToggle" class="theme-btn" aria-label="Modo noturno">
                <i class="fas fa-moon"></i>
            </button>
        </header>

        <!-- Search Bar -->
        <div class="search-section">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar por número, instrumento ou parte...">
                <button id="clearSearch" class="clear-btn" aria-label="Limpar busca">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <!-- Categories Tabs -->
        <div class="categories-section">
            <div class="tabs-container">
                <button class="tab-btn active" data-category="all">
                    <i class="fas fa-th-large"></i>
                    <span>Todos</span>
                </button>
                <button class="tab-btn" data-category="1a_partes">
                    <i class="fas fa-1"></i>
                    <span>1ª Partes</span>
                </button>
                <button class="tab-btn" data-category="2a_partes">
                    <i class="fas fa-2"></i>
                    <span>2ª Partes</span>
                </button>
                <button class="tab-btn" data-category="3a_partes">
                    <i class="fas fa-3"></i>
                    <span>3ª Partes</span>
                </button>
                <button class="tab-btn" data-category="avulsos">
                    <i class="fas fa-file-alt"></i>
                    <span>Avulsos</span>
                </button>
                <button class="tab-btn" data-category="canticos">
                    <i class="fas fa-church"></i>
                    <span>Cânticos</span>
                </button>
            </div>
        </div>

        <!-- Results Info -->
        <div class="results-info">
            <span id="resultCount"></span>
            <div class="last-update">
                <i class="fas fa-sync-alt"></i>
                <span id="lastCommitDate">Carregando...</span>
            </div>
        </div>

        <!-- Sheet Music Grid -->
        <main class="sheet-music-grid" id="sheetMusicGrid">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-pulse"></i>
                <p>Carregando partituras...</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2025 HinosIEB - Todas as partituras são de uso exclusivo da igreja</p>
            <p class="footer-note">Clique em qualquer partitura para abrir o PDF</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
